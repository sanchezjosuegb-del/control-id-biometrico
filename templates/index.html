<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control ID Biométrico - PROINTEC GUATEMALA S.A.</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #F4F6F9; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .bg-primary-custom { background-color: #0055B8; }
        .text-primary-custom { color: #0055B8; }
        .card-stat { border-radius: 8px; border: 1px solid #D1D5DB; }
        .table-container { background: #FFFFFF; border-radius: 8px; border: 1px solid #D1D5DB; }
    </style>
</head>
<body>

    <!-- Encabezado Blanco con Logo -->
    <header class="bg-white border-bottom py-2 px-3 mb-3 shadow-sm">
        <div class="container-fluid d-flex justify-content-between align-items-center flex-wrap gap-2">
            <div class="d-flex align-items-center gap-3">
               <img src="{{ url_for('static', filename='logo.png') }}" alt="Logo PROINTEC" style="height: 50px;">
                <h5 class="m-0 fw-bold text-primary-custom">SISTEMA DE CONTROL Y ASIGNACIÓN DE ID BIOMÉTRICO</h5>
            </div>
            <div class="d-flex align-items-center">
                <input type="text" id="searchInput" class="form-control form-control-sm" placeholder="🔍 Buscar colaborador..." onkeyup="filtrarTabla()">
            </div>
        </div>
    </header>

    <div class="container-fluid px-3">
        <!-- Tarjetas Estadísticas -->
        <div class="row g-2 mb-3">
            <div class="col-6 col-md-3">
                <div class="card card-stat p-2 bg-white">
                    <span class="small fw-bold text-danger">IDs OCUPADOS</span>
                    <h4 class="m-0 fw-bold text-dark" id="countOcupados">0</h4>
                </div>
            </div>
            <div class="col-6 col-md-3">
                <div class="card card-stat p-2 bg-white">
                    <span class="small fw-bold text-success">IDs DISPONIBLES</span>
                    <h4 class="m-0 fw-bold text-dark" id="countDisponibles">0</h4>
                </div>
            </div>
        </div>

        <!-- Tabla Registros -->
        <div class="table-container p-2 mb-3 table-responsive" style="max-height: 380px; overflow-y: auto;">
            <table class="table table-hover table-striped align-middle m-0" id="tablaIDs">
                <thead class="bg-primary-custom text-white sticky-top">
                    <tr>
                        <th class="text-center">ID BIOMÉTRICO</th>
                        <th>NOMBRE</th>
                        <th>APELLIDO</th>
                        <th class="text-center">ESTADO</th>
                        <th>OBSERVACIONES</th>
                    </tr>
                </thead>
                <tbody id="tablaBody">
                    <!-- Filas dinámicas -->
                </tbody>
            </table>
        </div>

        <!-- Formulario -->
        <div class="card p-3 bg-white border mb-3">
            <h6 class="fw-bold text-primary-custom mb-3">Detalle del Colaborador</h6>
            <form id="formColaborador" class="row g-2">
                <div class="col-12 col-md-2">
                    <label class="form-label small fw-bold text-secondary">ID Biométrico</label>
                    <input type="text" id="inputId" class="form-control form-control-sm" required>
                </div>
                <div class="col-12 col-md-3">
                    <label class="form-label small fw-bold text-secondary">Nombre</label>
                    <input type="text" id="inputNombre" class="form-control form-control-sm">
                </div>
                <div class="col-12 col-md-3">
                    <label class="form-label small fw-bold text-secondary">Apellido</label>
                    <input type="text" id="inputApellido" class="form-control form-control-sm">
                </div>
                <div class="col-12 col-md-2">
                    <label class="form-label small fw-bold text-secondary">Estado</label>
                    <select id="selectEstado" class="form-select form-select-sm">
                        <option value="Ocupado">Ocupado</option>
                        <option value="Disponible">Disponible</option>
                    </select>
                </div>
                <div class="col-12 col-md-2">
                    <label class="form-label small fw-bold text-secondary">Observaciones</label>
                    <input type="text" id="inputObservaciones" class="form-control form-control-sm">
                </div>
            </form>
        </div>

        <!-- Botones de Acción -->
        <div class="d-flex flex-wrap gap-2 justify-content-between align-items-center mb-4">
            <div class="d-flex flex-wrap gap-2">
                <button class="btn btn-sm btn-primary fw-bold" onclick="guardarRegistro()">💾 Guardar / Reasignar</button>
                <button class="btn btn-sm btn-outline-secondary" onclick="liberarRegistro()">🔓 Liberar ID</button>
                <button class="btn btn-sm btn-danger fw-bold" onclick="eliminarRegistro()">🗑️ Eliminar</button>
                <button class="btn btn-sm btn-light border" onclick="limpiarFormulario()">🧹 Limpiar Campos</button>
            </div>
            <span class="small text-muted fs-7">Guardado automático activo</span>
        </div>
    </div>

    <!-- Script de Integración Javascript -->
    <script>
        let registrosGlobales = [];
        let idSeleccionado = null;

        document.addEventListener("DOMContentLoaded", cargarDatos);

        async function cargarDatos() {
            const res = await fetch('/api/registros');
            const data = await res.json();
            registrosGlobales = data.registros;
            
            document.getElementById("countOcupados").innerText = data.stats.ocupados;
            document.getElementById("countDisponibles").innerText = data.stats.disponibles;

            renderTabla(registrosGlobales);
        }

        function renderTabla(lista) {
            const tbody = document.getElementById("tablaBody");
            tbody.innerHTML = "";
            
            lista.forEach(r => {
                const tr = document.createElement("tr");
                tr.style.cursor = "pointer";
                tr.onclick = () => seleccionarFila(r, tr);

                tr.innerHTML = `
                    <td class="text-center fw-bold">${r.id || ''}</td>
                    <td>${r.nombre || ''}</td>
                    <td>${r.apellido || ''}</td>
                    <td class="text-center"><span class="badge ${r.estado === 'Ocupado' ? 'bg-danger' : 'bg-success'}">${r.estado || ''}</span></td>
                    <td>${r.observaciones || ''}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        function seleccionarFila(r, tr) {
            document.querySelectorAll("#tablaBody tr").forEach(row => row.classList.remove("table-active"));
            tr.classList.add("table-active");

            idSeleccionado = r.id;
            document.getElementById("inputId").value = r.id || '';
            document.getElementById("inputNombre").value = r.nombre || '';
            document.getElementById("inputApellido").value = r.apellido || '';
            document.getElementById("selectEstado").value = r.estado || 'Ocupado';
            document.getElementById("inputObservaciones").value = r.observaciones || '';
        }

        async function guardarRegistro() {
            const payload = {
                id: document.getElementById("inputId").value.trim(),
                nombre: document.getElementById("inputNombre").value.trim(),
                apellido: document.getElementById("inputApellido").value.trim(),
                estado: document.getElementById("selectEstado").value,
                observaciones: document.getElementById("inputObservaciones").value.trim()
            };

            if (!payload.id) {
                alert("Por favor ingresa un ID válido.");
                return;
            }

            const res = await fetch('/api/guardar', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            const result = await res.json();
            alert(result.message);
            limpiarFormulario();
            cargarDatos();
        }

        async function liberarRegistro() {
            if (!idSeleccionado) {
                alert("Selecciona un registro de la tabla primero.");
                return;
            }
            if (confirm(`¿Deseas liberar el ID ${idSeleccionado}?`)) {
                const res = await fetch(`/api/liberar/${idSeleccionado}`, { method: 'PUT' });
                const result = await res.json();
                alert(result.message);
                limpiarFormulario();
                cargarDatos();
            }
        }

        async function eliminarRegistro() {
            if (!idSeleccionado) {
                alert("Selecciona un registro de la tabla primero.");
                return;
            }
            if (confirm(`¿Estás seguro de eliminar permanentemente el ID ${idSeleccionado}?`)) {
                const res = await fetch(`/api/eliminar/${idSeleccionado}`, { method: 'DELETE' });
                const result = await res.json();
                alert(result.message);
                limpiarFormulario();
                cargarDatos();
            }
        }

        function limpiarFormulario() {
            idSeleccionado = null;
            document.getElementById("formColaborador").reset();
            document.querySelectorAll("#tablaBody tr").forEach(row => row.classList.remove("table-active"));
        }

        function filtrarTabla() {
            const query = document.getElementById("searchInput").value.toLowerCase();
            const filtrados = registrosGlobales.filter(r => 
                Object.values(r).some(val => String(val).toLowerCase().includes(query))
            );
            renderTabla(filtrados);
        }
    </script>
</body>
</html>
