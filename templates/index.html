<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control ID Biométrico - PROINTEC GUATEMALA S.A.</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #0055B8;
        }

        html, body {
            height: 100vh;
            margin: 0;
            padding: 0;
            overflow: hidden; /* Elimina el scroll principal de la pantalla */
            background-color: #F4F6F9;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 0.85rem;
        }

        /* Layout rígido de pantalla completa */
        .app-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            padding: 8px 14px;
            box-sizing: border-box;
            gap: 8px;
        }

        .bg-primary-custom { background-color: var(--primary-color); }
        .text-primary-custom { color: var(--primary-color); }

        /* Header compacto */
        header {
            background: #ffffff;
            border-bottom: 1px solid #D1D5DB;
            padding: 6px 12px;
            border-radius: 6px;
        }

        /* Tarjetas de Estadísticas súper compactas */
        .card-stat {
            border-radius: 6px;
            border: 1px solid #D1D5DB;
            padding: 4px 10px !important;
        }

        /* Tabla ajustada dinámicamente */
        .table-container {
            flex: 1; /* Ocupa exactamente el espacio libre entre el header y el formulario */
            background: #FFFFFF;
            border-radius: 6px;
            border: 1px solid #D1D5DB;
            overflow-y: auto; /* Solo la tabla tiene scroll si hay muchos registros */
        }

        .table {
            font-size: 0.8rem;
            margin-bottom: 0;
        }

        .table th {
            position: sticky;
            top: 0;
            z-index: 2;
            background-color: var(--primary-color);
            color: white;
            padding: 6px;
            font-size: 0.78rem;
        }

        .table td {
            padding: 5px 8px;
        }

        /* Formulario compacto */
        .form-card {
            background: #ffffff;
            border-radius: 6px;
            border: 1px solid #D1D5DB;
            padding: 8px 12px !important;
        }

        .form-label {
            font-size: 0.75rem;
            margin-bottom: 2px;
        }

        .form-control-sm, .form-select-sm {
            font-size: 0.8rem;
            padding: 3px 6px;
        }

        .btn-sm {
            font-size: 0.78rem;
            padding: 3px 8px;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Encabezado Blanco con Logo Compacto -->
        <header class="d-flex justify-content-between align-items-center shadow-sm">
            <div class="d-flex align-items-center gap-2">
                <img src="/static/uploads/logo.png" alt="Logo PROINTEC" style="max-height: 32px; width: auto;" onerror="this.style.display='none'">
                <h6 class="m-0 fw-bold text-primary-custom" style="font-size: 0.95rem;">SISTEMA DE CONTROL Y ASIGNACIÓN DE ID BIOMÉTRICO</h6>
            </div>
            <div class="d-flex align-items-center">
                <input type="text" id="searchInput" class="form-control form-control-sm" placeholder="🔍 Buscar..." onkeyup="filtrarTabla()" style="width: 180px;">
            </div>
        </header>

        <!-- Tarjetas Estadísticas Compactas -->
        <div class="row g-2">
            <div class="col-6 col-md-3">
                <div class="card card-stat bg-white d-flex flex-row justify-content-between align-items-center">
                    <span class="fw-bold text-danger" style="font-size: 0.72rem;">IDs OCUPADOS</span>
                    <h5 class="m-0 fw-bold text-dark" id="countOcupados">0</h5>
                </div>
            </div>
            <div class="col-6 col-md-3">
                <div class="card card-stat bg-white d-flex flex-row justify-content-between align-items-center">
                    <span class="fw-bold text-success" style="font-size: 0.72rem;">IDs DISPONIBLES</span>
                    <h5 class="m-0 fw-bold text-dark" id="countDisponibles">0</h5>
                </div>
            </div>
        </div>

        <!-- Tabla de Registros (Ocupa el espacio dinámico disponible) -->
        <div class="table-container">
            <table class="table table-hover table-striped align-middle" id="tablaIDs">
                <thead>
                    <tr>
                        <th class="text-center" style="width: 120px;">ID BIOMÉTRICO</th>
                        <th>NOMBRE</th>
                        <th>APELLIDO</th>
                        <th class="text-center" style="width: 110px;">ESTADO</th>
                        <th>OBSERVACIONES</th>
                    </tr>
                </thead>
                <tbody id="tablaBody">
                    <!-- Filas dinámicas -->
                </tbody>
            </table>
        </div>

        <!-- Formulario Compacto -->
        <div class="card form-card">
            <h6 class="fw-bold text-primary-custom mb-2" style="font-size: 0.85rem;">Detalle del Colaborador</h6>
            <form id="formColaborador" class="row g-2">
                <div class="col-6 col-md-2">
                    <label class="form-label fw-bold text-secondary">ID Biométrico</label>
                    <input type="text" id="inputId" class="form-control form-control-sm" required>
                </div>
                <div class="col-6 col-md-2">
                    <label class="form-label fw-bold text-secondary">Nombre</label>
                    <input type="text" id="inputNombre" class="form-control form-control-sm">
                </div>
                <div class="col-6 col-md-2">
                    <label class="form-label fw-bold text-secondary">Apellido</label>
                    <input type="text" id="inputApellido" class="form-control form-control-sm">
                </div>
                <div class="col-6 col-md-2">
                    <label class="form-label fw-bold text-secondary">Estado</label>
                    <select id="selectEstado" class="form-select form-select-sm">
                        <option value="Ocupado">Ocupado</option>
                        <option value="Disponible">Disponible</option>
                    </select>
                </div>
                <div class="col-12 col-md-4">
                    <label class="form-label fw-bold text-secondary">Observaciones</label>
                    <input type="text" id="inputObservaciones" class="form-control form-control-sm">
                </div>
            </form>
        </div>

        <!-- Botones de Acción Fijos Abajo -->
        <div class="d-flex flex-wrap gap-2 justify-content-between align-items-center pb-1">
            <div class="d-flex flex-wrap gap-1">
                <button class="btn btn-sm btn-primary fw-bold" onclick="guardarRegistro()">💾 Guardar / Reasignar</button>
                <button class="btn btn-sm btn-outline-secondary" onclick="liberarRegistro()">🔓 Liberar ID</button>
                <button class="btn btn-sm btn-danger fw-bold" onclick="eliminarRegistro()">🗑️ Eliminar</button>
                <button class="btn btn-sm btn-light border" onclick="limpiarFormulario()">🧹 Limpiar Campos</button>
            </div>
            <span class="text-muted" style="font-size: 0.7rem;">Guardado automático activo</span>
        </div>
    </div>

    <!-- Script de Integración Javascript -->
    <script>
        let registrosGlobales = [];
        let idSeleccionado = null;

        document.addEventListener("DOMContentLoaded", cargarDatos);

        async function cargarDatos() {
            try {
                const res = await fetch('/api/registros');
                const data = await res.json();
                registrosGlobales = data.registros;
                
                document.getElementById("countOcupados").innerText = data.stats.ocupados;
                document.getElementById("countDisponibles").innerText = data.stats.disponibles;

                renderTabla(registrosGlobales);
            } catch (e) {
                console.error("Error cargando registros:", e);
            }
        }

        function renderTabla(lista) {
            const tbody = document.getElementById("tablaBody");
            tbody.innerHTML = "";
            
            lista.forEach(r => {
                const tr = document.createElement("tr");
                tr.style.cursor = "pointer";
                tr.onclick = () => seleccionarFila(r, tr);

                tr.innerHTML = `
                    <td class="text-center fw-bold">${r.id || ''}</td>
                    <td>${r.nombre || ''}</td>
                    <td>${r.apellido || ''}</td>
                    <td class="text-center"><span class="badge ${r.estado === 'Ocupado' ? 'bg-danger' : 'bg-success'}" style="font-size: 0.7rem;">${r.estado || ''}</span></td>
                    <td>${r.observaciones || ''}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        function seleccionarFila(r, tr) {
            document.querySelectorAll("#tablaBody tr").forEach(row => row.classList.remove("table-active"));
            tr.classList.add("table-active");

            idSeleccionado = r.id;
            document.getElementById("inputId").value = r.id || '';
            document.getElementById("inputNombre").value = r.nombre || '';
            document.getElementById("inputApellido").value = r.apellido || '';
            document.getElementById("selectEstado").value = r.estado || 'Ocupado';
            document.getElementById("inputObservaciones").value = r.observaciones || '';
        }

        async function guardarRegistro() {
            const payload = {
                id: document.getElementById("inputId").value.trim(),
                nombre: document.getElementById("inputNombre").value.trim(),
                apellido: document.getElementById("inputApellido").value.trim(),
                estado: document.getElementById("selectEstado").value,
                observaciones: document.getElementById("inputObservaciones").value.trim()
            };

            if (!payload.id) {
                alert("Por favor ingresa un ID válido.");
                return;
            }

            const res = await fetch('/api/guardar', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            const result = await res.json();
            alert(result.message);
            limpiarFormulario();
            cargarDatos();
        }

        async function liberarRegistro() {
            if (!idSeleccionado) {
                alert("Selecciona un registro de la tabla primero.");
                return;
            }
            if (confirm(`¿Deseas liberar el ID ${idSeleccionado}?`)) {
                const res = await fetch(`/api/liberar/${idSeleccionado}`, { method: 'PUT' });
                const result = await res.json();
                alert(result.message);
                limpiarFormulario();
                cargarDatos();
            }
        }

        async function eliminarRegistro() {
            if (!idSeleccionado) {
                alert("Selecciona un registro de la tabla primero.");
                return;
            }
            if (confirm(`¿Estás seguro de eliminar permanentemente el ID ${idSeleccionado}?`)) {
                const res = await fetch(`/api/eliminar/${idSeleccionado}`, { method: 'DELETE' });
                const result = await res.json();
                alert(result.message);
                limpiarFormulario();
                cargarDatos();
            }
        }

        function limpiarFormulario() {
            idSeleccionado = null;
            document.getElementById("formColaborador").reset();
            document.querySelectorAll("#tablaBody tr").forEach(row => row.classList.remove("table-active"));
        }

        function filtrarTabla() {
            const query = document.getElementById("searchInput").value.toLowerCase();
            const filtrados = registrosGlobales.filter(r => 
                Object.values(r).some(val => String(val).toLowerCase().includes(query))
            );
            renderTabla(filtrados);
        }
    </script>
</body>
</html>
