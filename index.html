
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control ID Biométrico - PROINTEC GUATEMALA S.A.</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root { --primary-color: #0055B8; }
        body { background-color: #F4F6F9; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; font-size: 0.85rem; margin: 0; padding: 0; }
        .bg-primary-custom { background-color: var(--primary-color); }
        .text-primary-custom { color: var(--primary-color); }
        .app-container { display: flex; flex-direction: column; padding: 10px; gap: 10px; min-height: 100vh; }
        header { background: #ffffff; border-bottom: 1px solid #D1D5DB; padding: 8px 12px; border-radius: 6px; }
        .card-stat { border-radius: 6px; border: 1px solid #D1D5DB; padding: 6px 12px !important; }
        .table-container { background: #FFFFFF; border-radius: 6px; border: 1px solid #D1D5DB; overflow-y: auto; max-height: 380px; }
        .table { font-size: 0.8rem; margin-bottom: 0; }
        .table th { position: sticky; top: 0; z-index: 2; background-color: var(--primary-color); color: white; padding: 6px; font-size: 0.78rem; }
        .table td { padding: 6px 8px; }
        .form-card { background: #ffffff; border-radius: 6px; border: 1px solid #D1D5DB; padding: 10px 12px !important; }
        .btn-responsive { font-size: 0.8rem; padding: 6px 12px; font-weight: 600; }
        @media (min-width: 992px) {
            html, body { height: 100vh; overflow: hidden; }
            .app-container { height: 100vh; padding: 10px 16px; box-sizing: border-box; }
            .table-container { flex: 1; max-height: none; }
            .btn-responsive { font-size: 0.78rem; padding: 4px 10px; }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- HEADER -->
        <header class="d-flex justify-content-between align-items-center shadow-sm flex-wrap gap-2">
            <div class="d-flex align-items-center gap-2">
                <h6 class="m-0 fw-bold text-primary-custom" style="font-size: 0.95rem;">SISTEMA DE CONTROL Y ASIGNACIÓN DE ID BIOMÉTRICO</h6>
            </div>
            <div class="d-flex align-items-center w-100 w-md-auto">
                <input type="text" id="searchInput" class="form-control form-control-sm w-100" placeholder="🔍 Buscar..." onkeyup="filtrarTabla()" style="max-width: 200px;">
            </div>
        </header>

        <!-- TARJETAS DE ESTADÍSTICAS -->
        <div class="row g-2">
            <div class="col-6 col-md-3">
                <div class="card card-stat bg-white d-flex flex-row justify-content-between align-items-center">
                    <span class="fw-bold text-danger" style="font-size: 0.72rem;">IDs OCUPADOS</span>
                    <h5 class="m-0 fw-bold text-dark" id="countOcupados">0</h5>
                </div>
            </div>
            <div class="col-6 col-md-3">
                <div class="card card-stat bg-white d-flex flex-row justify-content-between align-items-center">
                    <span class="fw-bold text-success" style="font-size: 0.72rem;">IDs DISPONIBLES</span>
                    <h5 class="m-0 fw-bold text-dark" id="countDisponibles">0</h5>
                </div>
            </div>
        </div>

        <!-- TABLA -->
        <div class="table-container">
            <table class="table table-hover table-striped align-middle" id="tablaIDs">
                <thead>
                    <tr>
                        <th class="text-center" style="width: 110px;">ID BIOMÉTRICO</th>
                        <th>NOMBRE</th>
                        <th>APELLIDO</th>
                        <th class="text-center" style="width: 100px;">ESTADO</th>
                        <th>OBSERVACIONES</th>
                    </tr>
                </thead>
                <tbody id="tablaBody"></tbody>
            </table>
        </div>

        <!-- FORMULARIO DE EDICIÓN / REGISTRO -->
        <div class="card form-card">
            <h6 class="fw-bold text-primary-custom mb-2" style="font-size: 0.85rem;">Detalle del Colaborador</h6>
            <form id="formColaborador" class="row g-2">
                <div class="col-6 col-md-2">
                    <label class="form-label fw-bold text-secondary">ID Biométrico</label>
                    <input type="text" id="inputId" class="form-control form-control-sm" required>
                </div>
                <div class="col-6 col-md-2">
                    <label class="form-label fw-bold text-secondary">Nombre</label>
                    <input type="text" id="inputNombre" class="form-control form-control-sm">
                </div>
                <div class="col-6 col-md-2">
                    <label class="form-label fw-bold text-secondary">Apellido</label>
                    <input type="text" id="inputApellido" class="form-control form-control-sm">
                </div>
                <div class="col-6 col-md-2">
                    <label class="form-label fw-bold text-secondary">Estado</label>
                    <select id="selectEstado" class="form-select form-select-sm">
                        <option value="Ocupado">Ocupado</option>
                        <option value="Disponible">Disponible</option>
                    </select>
                </div>
                <div class="col-12 col-md-4">
                    <label class="form-label fw-bold text-secondary">Observaciones</label>
                    <input type="text" id="inputObservaciones" class="form-control form-control-sm">
                </div>
            </form>
        </div>

        <!-- BOTONES DE ACCIÓN -->
        <div class="d-flex flex-wrap gap-2 justify-content-between align-items-center pt-1 pb-2">
            <div class="d-flex flex-wrap gap-2 w-100 w-md-auto">
                <button class="btn btn-primary btn-responsive fw-bold flex-fill flex-md-grow-0" onclick="guardarRegistro()">💾 Guardar / Reasignar</button>
                <button class="btn btn-outline-secondary btn-responsive flex-fill flex-md-grow-0" onclick="liberarRegistro()">🔓 Liberar ID</button>
                <button class="btn btn-danger btn-responsive fw-bold flex-fill flex-md-grow-0" onclick="eliminarRegistro()">🗑️ Eliminar</button>
                <button class="btn btn-light border btn-responsive flex-fill flex-md-grow-0" onclick="limpiarFormulario()">🧹 Limpiar Campos</button>
            </div>
            <span class="text-muted small" style="font-size: 0.7rem;">Base de datos en Google Sheets</span>
        </div>
    </div>

    <script>
        // PEGA AQUÍ TU URL DE GOOGLE APPS SCRIPT (Reemplaza la URL de abajo por la tuya)
        const API_URL = 'https://script.google.com/macros/s/AKfycbxtvbJOTyv5yRvHU9f3yAEt0VehzCbl2gE7aL-8_FS5s3fI-sVIaeGuitckO2Lzi3kX/exec';

        let registrosGlobales = [];
        let idSeleccionado = null;

        document.addEventListener("DOMContentLoaded", cargarDatos);

        async function cargarDatos() {
            try {
                const res = await fetch(API_URL);
                const data = await res.json();
                registrosGlobales = data.registros;
                document.getElementById("countOcupados").innerText = data.stats.ocupados;
                document.getElementById("countDisponibles").innerText = data.stats.disponibles;
                renderTabla(registrosGlobales);
            } catch (e) {
                console.error("Error cargando registros:", e);
            }
        }

        function renderTabla(lista) {
            const tbody = document.getElementById("tablaBody");
            tbody.innerHTML = "";
            lista.forEach(r => {
                const tr = document.createElement("tr");
                tr.style.cursor = "pointer";
                tr.onclick = () => seleccionarFila(r, tr);
                tr.innerHTML = `
                    <td class="text-center fw-bold">${r.id || ''}</td>
                    <td>${r.nombre || ''}</td>
                    <td>${r.apellido || ''}</td>
                    <td class="text-center"><span class="badge ${r.estado === 'Ocupado' ? 'bg-danger' : 'bg-success'}">${r.estado || ''}</span></td>
                    <td>${r.observaciones || ''}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        function seleccionarFila(r, tr) {
            document.querySelectorAll("#tablaBody tr").forEach(row => row.classList.remove("table-active"));
            tr.classList.add("table-active");
            idSeleccionado = r.id;
            document.getElementById("inputId").value = r.id || '';
            document.getElementById("inputNombre").value = r.nombre || '';
            document.getElementById("inputApellido").value = r.apellido || '';
            document.getElementById("selectEstado").value = r.estado || 'Ocupado';
            document.getElementById("inputObservaciones").value = r.observaciones || '';
        }

        async function enviarAccion(payload) {
            await fetch(API_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            setTimeout(cargarDatos, 1500);
        }

        function guardarRegistro() {
            const id = document.getElementById("inputId").value.trim();
            if (!id) return alert("Ingresa un ID válido.");
            
            enviarAccion({
                action: "guardar",
                id: id,
                nombre: document.getElementById("inputNombre").value.trim(),
                apellido: document.getElementById("inputApellido").value.trim(),
                estado: document.getElementById("selectEstado").value,
                observaciones: document.getElementById("inputObservaciones").value.trim()
            });
            alert("Guardando registro...");
            limpiarFormulario();
        }

        function liberarRegistro() {
            if (!idSeleccionado) return alert("Selecciona un registro primero.");
            if (confirm(`¿Liberar ID ${idSeleccionado}?`)) {
                enviarAccion({ action: "liberar", id: idSeleccionado });
                alert("Liberando ID...");
                limpiarFormulario();
            }
        }

        function eliminarRegistro() {
            if (!idSeleccionado) return alert("Selecciona un registro primero.");
            if (confirm(`¿Eliminar ID ${idSeleccionado}?`)) {
                enviarAccion({ action: "eliminar", id: idSeleccionado });
                alert("Eliminando registro...");
                limpiarFormulario();
            }
        }

        function limpiarFormulario() {
            idSeleccionado = null;
            document.getElementById("formColaborador").reset();
            document.querySelectorAll("#tablaBody tr").forEach(row => row.classList.remove("table-active"));
        }

        function filtrarTabla() {
            const query = document.getElementById("searchInput").value.toLowerCase();
            const filtrados = registrosGlobales.filter(r => 
                Object.values(r).some(val => String(val).toLowerCase().includes(query))
            );
            renderTabla(filtrados);
        }
    </script>
</body>
</html>
